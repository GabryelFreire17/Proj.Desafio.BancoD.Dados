<div class="card p-4">
    <div class="flex justify-content-between align-items-center mb-3">
        <h2>Listagem de Comércios</h2>

        <hr class="my-5"> <!-- Linha divisória -->
        <button pButton label="Novo Comércio" icon="pi pi-plus" (click)="abrirModal()"></button>
        <hr class="my-5"> <!-- Linha divisória -->
    </div>

    <p-table [value]="comercios" class="mt-3 shadow-1">
        <ng-template pTemplate="header">
            <tr>
                <th>Nome</th>
                <th>Tipo</th>
                <th style="width: 150px">Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-comercio>
            <tr>
                <td>{{comercio.nome}}</td>
                <td>{{comercio.tipoComercio}}</td>
                <td>
                    <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-text" (click)="editar(comercio)"></button>
                    <button pButton icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger" (click)="excluirComercio(comercio.id)"></button>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr>
                <td colspan="3" class="text-center p-4">Nenhum comércio cadastrado.</td>
            </tr>
        </ng-template>
    </p-table>
    

<div class="card p-4">
    <h2>Listagem de Cidades</h2>

    <hr class="my-5"> <!-- Linha divisória -->
    
    <div class="mt-4">
        <button pButton label="Gerenciar Cidades" icon="pi pi-map" class="p-button-secondary p-button-text" (click)="abrirModalCidade()"></button>
    </div>
</div>

<p-dialog header="Gerenciar Comércio" [(visible)]="exibirModal" [modal]="true" [style]="{ width: '500px' }">
    <div class="flex flex-column gap-4 py-3">
        
        <div class="field">
            <label class="block font-bold mb-2">Nome do Comércio</label>
            <input pInputText [(ngModel)]="novoComercio.nome" class="w-full" placeholder="Ex: Padaria do João" />
        </div>

        <div class="field">
            <label class="block font-bold mb-2">Nome do Responsável</label>
            <input pInputText [(ngModel)]="novoComercio.nomeResponsavel" class="w-full" placeholder="Ex: Maria Silva" />
        </div>

        <div class="field">
            <label class="block font-bold mb-2">Tipo de Comércio</label>
            <p-dropdown [options]="tipos" [(ngModel)]="novoComercio.tipoComercio" optionValue="value" placeholder="Selecione o Tipo" [style]="{'width':'100%'}" appendTo="body">
            </p-dropdown>
        </div>

        <div class="field">
            <label class="block font-bold mb-2">Cidade</label>
            <p-dropdown [options]="cidades" optionLabel="nome" optionValue="id" [(ngModel)]="novoComercio.cidadeId" placeholder="Selecione a Cidade" [style]="{'width':'100%'}" appendTo="body">
            </p-dropdown>
        </div>
    </div>
    
    <ng-template pTemplate="footer">
        <button pButton label="Cancelar" class="p-button-text" (click)="exibirModal = false"></button>
        <button pButton label="Salvar" icon="pi pi-check" (click)="salvar()"></button>
    </ng-template>
</p-dialog>

<hr class="my-5"> <!-- Linha divisória -->
    
    <p-table [value]="cidades" class="mt-3 shadow-1">
        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>Nome da Cidade</th>
                <th style="width: 150px">Ações</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-cidade>
            <tr>
                <td>{{cidade.id}}</td>
                <td>{{cidade.nome}}</td>
                <td>
                   
                    <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-text" (click)="editarCidade(cidade)"></button>
                   
                    <button pButton icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger" (click)="excluirCidade(cidade.id)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
